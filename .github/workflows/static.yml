name: Publish AG Arcade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            assets/arcade
            files/drive-mad
      - name: Prepare curated site
        run: |
          mkdir -p site/assets site/files
          cp index.html library.html drive-mad.html 404.html LICENSE site/
          cp -R assets/arcade site/assets/
          cp -R files/drive-mad site/files/
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
